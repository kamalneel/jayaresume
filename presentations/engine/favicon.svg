<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A054"/>
      <stop offset="100%" style="stop-color:#B87514"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bg-gradient)"/>
  <!-- Presentation screen top bar -->
  <rect x="4" y="6" width="24" height="3" rx="1" fill="#4B5563"/>
  <!-- Screen body -->
  <rect x="4" y="9" width="24" height="16" fill="white" stroke="#4B5563" stroke-width="1"/>
  <!-- Projector content - simple slide icon -->
  <polygon points="10,13 10,21 17,17" fill="#D1D5DB"/>
  <rect x="18" y="13" width="7" height="8" fill="#6B7280" rx="1"/>
  <circle cx="21.5" cy="19" r="1" fill="white"/>
  <!-- Pull cord -->
  <line x1="16" y1="25" x2="16" y2="28" stroke="#4B5563" stroke-width="1"/>
  <circle cx="16" cy="29" r="1.5" fill="none" stroke="#4B5563" stroke-width="1"/>
</svg>





