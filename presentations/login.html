<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Locked</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f1115;
    color: #e8e8ea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  .card {
    width: min(90vw, 360px);
    padding: 2.5rem 2rem;
    border-radius: 16px;
    background: #181b21;
    border: 1px solid #262a33;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    text-align: center;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0 0 1.5rem;
    color: #f4f4f5;
  }
  input[type="password"] {
    width: 100%;
    padding: 0.75rem 0.9rem;
    border-radius: 10px;
    border: 1px solid #2e333d;
    background: #0f1115;
    color: #f4f4f5;
    font-size: 1rem;
    letter-spacing: 0.2em;
    text-align: center;
    outline: none;
  }
  input[type="password"]:focus {
    border-color: #5b8def;
  }
  button {
    width: 100%;
    margin-top: 1rem;
    padding: 0.75rem;
    border-radius: 10px;
    border: none;
    background: #5b8def;
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover {
    background: #4a7bd9;
  }
  .error {
    margin: 1rem 0 0;
    color: #f16565;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Enter PIN to continue</h1>
    <form method="POST" action="/api/presentations-auth">
      <input type="hidden" name="redirect" value="">
      <input type="password" name="pin" inputmode="numeric" autocomplete="off" autofocus required>
      <button type="submit">Unlock</button>
    </form>
    <p class="error" id="error" hidden>Incorrect PIN. Try again.</p>
  </div>
  <script>
    var params = new URLSearchParams(location.search);
    var redirect = params.get('redirect') || '/presentations/';
    document.querySelector('input[name="redirect"]').value = redirect;
    if (params.get('error')) {
      document.getElementById('error').hidden = false;
    }
  </script>
</body>
</html>
