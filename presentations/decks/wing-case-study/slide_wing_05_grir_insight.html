<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 100%; height: 100%; overflow: hidden; }
  body { width: 100%; height: 100%; overflow: hidden; position: relative; font-family: 'Inter', sans-serif; background: #14161C; color: #ECEEF3; }
  .slide-scaler { width: 1920px; height: 1080px; transform-origin: top left; position: absolute; overflow: hidden; }
  .slide { width: 1920px; height: 1080px; padding: 120px 180px; display: flex; flex-direction: column; justify-content: center; position: relative; }
  .glow { position: absolute; width: 780px; height: 780px; border-radius: 50%; filter: blur(150px); background: rgba(45,212,191,0.14); top: -160px; left: -160px; pointer-events: none; }
  .eyebrow { position: relative; font-size: 20px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #8B93A7; margin-bottom: 36px; }
  h1 { position: relative; font-size: 84px; line-height: 1.08; font-weight: 800; letter-spacing: -0.03em; max-width: 1500px; }
  h1 em { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400; color: #2DD4BF; }
  .flow { position: relative; margin-top: 72px; display: flex; align-items: center; gap: 0; }
  .node { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 26px 30px; font-size: 22px; font-weight: 600; color: #E4E7EE; white-space: nowrap; }
  .node.mid { border-color: rgba(45,212,191,0.4); color: #2DD4BF; }
  .arrow { flex: 1; height: 2px; background: rgba(255,255,255,0.15); margin: 0 18px; min-width: 40px; }
  .sla { position: relative; margin-top: 64px; font-size: 25px; color: #AEB6C6; }
  .sla b { color: #ECEEF3; font-weight: 600; }
</style>
</head>
<body>
  <div class="slide-scaler">
    <div class="slide">
      <div class="glow"></div>
      <div class="eyebrow">Module 2 — PO Accrual Automation</div>
      <h1>SAP already <em>computes this accrual</em></h1>
      <div class="flow">
        <div class="node">PO Issued</div>
        <div class="arrow"></div>
        <div class="node">Goods Receipt</div>
        <div class="arrow"></div>
        <div class="node mid">GR/IR Clearing</div>
        <div class="arrow"></div>
        <div class="node">Invoice Receipt</div>
      </div>
      <p class="sla">Open GR/IR balance at month-end <b>is</b> the accrual. Behavior fix: Goods Receipt entry becomes a business-owner SLA — <b>within 2 business days of receipt</b> — not a month-end chase.</p>
    </div>
  </div>
  <script>
  (function(){
    function s(){var el=document.querySelector(".slide-scaler");if(!el)return;
    var vw=window.innerWidth,vh=window.innerHeight,scale=Math.min(vw/1920,vh/1080);
    el.style.transform="scale("+scale+")";
    el.style.left=((vw-1920*scale)/2)+"px";
    el.style.top=((vh-1080*scale)/2)+"px";}
    window.addEventListener("resize",s);s();
  })();
  </script>
</body>
</html>
