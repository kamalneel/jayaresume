<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 100%; height: 100%; overflow: hidden; }
  body { width: 100%; height: 100%; overflow: hidden; position: relative; font-family: 'Inter', sans-serif; background: #14161C; color: #ECEEF3; }
  .slide-scaler { width: 1920px; height: 1080px; transform-origin: top left; position: absolute; overflow: hidden; }
  .slide { width: 1920px; height: 1080px; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 220px; }
  .glow { position: absolute; width: 900px; height: 900px; border-radius: 50%; filter: blur(150px); background: rgba(45,212,191,0.12); top: 50%; left: 50%; transform: translate(-50%,-50%); pointer-events: none; }
  .eyebrow { position: relative; font-size: 20px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #8B93A7; margin-bottom: 40px; }
  h1 { position: relative; font-size: 92px; line-height: 1.1; font-weight: 800; letter-spacing: -0.03em; max-width: 1400px; }
  h1 em { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400; color: #A5B4FC; }
  .cta { position: relative; margin-top: 56px; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 23px; color: #2DD4BF; background: rgba(45,212,191,0.1); border: 1px solid rgba(45,212,191,0.35); padding: 18px 32px; border-radius: 14px; }
</style>
</head>
<body>
  <div class="slide-scaler">
    <div class="slide">
      <div class="glow"></div>
      <div class="eyebrow">Next Steps</div>
      <h1>Ready to bring this rigor to <em>Wing's close</em></h1>
      <div class="cta">Jaya Agrawal &middot; jaya.agr09@gmail.com</div>
    </div>
  </div>
  <script>
  (function(){
    function s(){var el=document.querySelector(".slide-scaler");if(!el)return;
    var vw=window.innerWidth,vh=window.innerHeight,scale=Math.min(vw/1920,vh/1080);
    el.style.transform="scale("+scale+")";
    el.style.left=((vw-1920*scale)/2)+"px";
    el.style.top=((vh-1080*scale)/2)+"px";}
    window.addEventListener("resize",s);s();
  })();
  </script>
</body>
</html>
